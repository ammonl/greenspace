name: Terraform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/terraform/**"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "eu-north-1"

jobs:
  # --------------- Module: offline terraform test (no AWS credentials) ---------------
  #
  # Runs only the module's fully self-contained *.tftest.hcl files — the ones
  # that mock the AWS provider (skip_credentials_validation + override_data on
  # aws_caller_identity/aws_region) so they need no OIDC role and are safe to
  # run on fork PRs.

  test-module:
    name: "Test (module)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: infra/terraform/modules/greenspace_stack
        run: terraform init -backend=false -input=false

      - name: Terraform test
        working-directory: infra/terraform/modules/greenspace_stack
        run: terraform test -no-color -filter=retirement.tftest.hcl -filter=iam_bootstrap.tftest.hcl -filter=iam.tftest.hcl

  # --------------- Provider lock files (no AWS credentials) ---------------
  #
  # Every directory here commits its own lock file, and they are only useful
  # if they stay in step: the offline `Test (module)` run has to exercise the
  # same provider version that `Plan` and `Apply` use. Nothing else in this
  # workflow enforces that — the init steps above and below are all writable,
  # so a lock that disagrees with its configuration is rewritten in the
  # runner's working copy and the job still passes.

  lock-check:
    name: "Lock check"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The steps below parse terraform output, which the wrapper decorates.
          terraform_wrapper: false

      # Derived rather than hand-listed: a directory added later would
      # otherwise go unguarded while the job still reported green, which is
      # the drift this job exists to catch, one level up.
      - name: Discover terraform directories
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(grep -rl --include='*.tf' --exclude-dir=.terraform required_providers infra/terraform || true)
          if [ -z "$FILES" ]; then
            echo "::error::no terraform directory under infra/terraform declares required_providers"
            exit 1
          fi
          DIRS=$(echo "$FILES" | xargs -n1 dirname | sort -u)
          STATUS=0
          for DIR in $DIRS; do
            if [ -f "$DIR/.terraform.lock.hcl" ]; then
              echo "$DIR"
            else
              echo "::error::$DIR declares required_providers but commits no .terraform.lock.hcl — run 'terraform init' there and commit the lock"
              STATUS=1
            fi
          done
          echo "TF_DIRS=$(echo "$DIRS" | tr '\n' ' ')" >> "$GITHUB_ENV"
          exit "$STATUS"

      # Taken before the inits below, while the tree is still just
      # configuration — after an init every directory carries a provider cache
      # far larger than the files being copied.
      - name: Snapshot configuration for constraint regeneration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/lock-check"
          mkdir -p "$RUNNER_TEMP/lock-check"
          cp -R infra/terraform "$RUNNER_TEMP/lock-check/terraform"

      # `-lockfile=readonly` fails when terraform wants to write the lock at
      # all, which covers a missing lock, one lacking hashes for the runner's
      # platform, and one whose recorded version no longer satisfies the
      # configured constraint. It compares nothing across directories, so
      # agreement is asserted separately — over every provider rather than a
      # named one, so adding a second provider cannot quietly widen the gap.
      # A provider only one directory uses never conflicts.
      - name: Verify locks are complete and agree on provider versions
        shell: bash
        run: |
          set -euo pipefail
          declare -A PINNED
          declare -A PINNED_BY
          STATUS=0
          for DIR in $TF_DIRS; do
            echo "--- $DIR ---"
            if ! terraform -chdir="$DIR" init -backend=false -input=false -lockfile=readonly; then
              echo "::error::$DIR: 'terraform init -lockfile=readonly' failed — the committed lock is missing, lacks hashes for this platform, or no longer satisfies the configured version constraint"
              STATUS=1
              continue
            fi
            SELECTIONS=$(terraform -chdir="$DIR" version -json |
              jq -r '.provider_selections | to_entries[] | "\(.key) \(.value)"')
            if [ -z "$SELECTIONS" ]; then
              echo "::error::$DIR locks no providers at all"
              STATUS=1
              continue
            fi
            while read -r PROVIDER VERSION; do
              echo "$DIR pins $PROVIDER $VERSION"
              if [ -n "${PINNED[$PROVIDER]:-}" ] && [ "${PINNED[$PROVIDER]}" != "$VERSION" ]; then
                echo "::error::$DIR pins $PROVIDER $VERSION, but ${PINNED_BY[$PROVIDER]} pins ${PINNED[$PROVIDER]} — run 'terraform init -upgrade' in every directory and commit the locks together"
                STATUS=1
              else
                PINNED[$PROVIDER]="$VERSION"
                PINNED_BY[$PROVIDER]="$DIR"
              fi
            done <<< "$SELECTIONS"
          done
          exit "$STATUS"

      # A lock's `constraints` line is only rewritten when the selected
      # version changes, so raising a `required_providers` floor leaves the
      # lock asserting a constraint the configuration no longer declares and
      # no init — readonly, plain, or `-upgrade` — objects. Regenerating from
      # no lock at all is what produces a fresh constraint to compare against.
      # This runs on the snapshot so the committed locks are never touched;
      # the regenerated versions and hashes are ignored. Constraints are
      # compared alongside the provider lines that own them, so the
      # comparison cannot slide onto a different provider.
      - name: Verify locks record the constraints the configuration declares
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/lock-check/terraform"
          PATTERN='^provider |^[[:space:]]*constraints'
          STATUS=0
          for DIR in $TF_DIRS; do
            if ! RECORDED=$(grep -E "$PATTERN" "$DIR/.terraform.lock.hcl"); then
              echo "::error::$DIR: .terraform.lock.hcl declares no provider blocks"
              STATUS=1
              continue
            fi
            SNAPSHOT="$WORK/${DIR#infra/terraform/}"
            rm -f "$SNAPSHOT/.terraform.lock.hcl"
            terraform -chdir="$SNAPSHOT" init -backend=false -input=false > /dev/null
            DECLARED=$(grep -E "$PATTERN" "$SNAPSHOT/.terraform.lock.hcl")
            if [ "$RECORDED" = "$DECLARED" ]; then
              echo "$DIR records the constraints its configuration declares"
            else
              echo "::error::$DIR: the committed lock's constraints disagree with the configuration — delete its .terraform.lock.hcl and re-run 'terraform init' to regenerate it"
              diff <(echo "$RECORDED") <(echo "$DECLARED") || true
              STATUS=1
            fi
          done
          exit "$STATUS"

  # --------------- Pull Request: plan per environment ---------------

  plan-staging:
    name: "Plan (staging)"
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/staging
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra/terraform/environments/staging
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform/environments/staging
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan-output.txt

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: |
            infra/terraform/environments/staging/tfplan
            infra/terraform/environments/staging/plan-output.txt
          retention-days: 7

  plan-prod:
    name: "Plan (prod)"
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/prod
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra/terraform/environments/prod
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform/environments/prod
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan-output.txt

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: |
            infra/terraform/environments/prod/tfplan
            infra/terraform/environments/prod/plan-output.txt
          retention-days: 7

  # --------------- Fork PRs: backend-disabled validate only ---------------

  validate-fork:
    name: "Validate (fork)"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate all environments (backend disabled)
        run: |
          for ENV_DIR in infra/terraform/environments/*; do
            if [ ! -d "$ENV_DIR" ]; then
              continue
            fi
            echo "--- Validating $ENV_DIR ---"
            terraform -chdir="$ENV_DIR" init -backend=false
            terraform -chdir="$ENV_DIR" validate
          done

  # --------------- Deploy pipeline: detect → apply staging → apply prod ---------------

  detect-staging:
    name: "Detect changes (staging)"
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/staging
        run: terraform init -input=false

      - name: Terraform plan (detect changes)
        id: plan
        working-directory: infra/terraform/environments/staging
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform plan failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-tfplan-staging
          path: |
            infra/terraform/environments/staging/tfplan
            infra/terraform/environments/staging/plan-output.txt
          retention-days: 7

  detect-prod:
    name: "Detect changes (prod)"
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/prod
        run: terraform init -input=false

      - name: Terraform plan (detect changes)
        id: plan
        working-directory: infra/terraform/environments/prod
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform plan failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-tfplan-prod
          path: |
            infra/terraform/environments/prod/tfplan
            infra/terraform/environments/prod/plan-output.txt
          retention-days: 7

  apply-staging:
    name: "Apply (staging)"
    needs: detect-staging
    if: needs.detect-staging.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/staging
        run: terraform init -input=false

      - name: Download plan from detect job
        uses: actions/download-artifact@v4
        with:
          name: deploy-tfplan-staging
          path: infra/terraform/environments/staging

      - name: Terraform apply
        working-directory: infra/terraform/environments/staging
        run: terraform apply -input=false -no-color tfplan

  verify-staging:
    name: "Verify (staging)"
    needs: apply-staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Function URL
        id: url
        run: |
          URL=$(aws lambda get-function-url-config \
            --function-name "${{ vars.API_FUNCTION_NAME }}" \
            --query 'FunctionUrl' --output text)
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"

      # /public/status executes real DB reads, so a 200 here proves the
      # applied stack end to end (Lambda → VPC/networking → RDS), not just
      # that the function is reachable. Retries cover ENI/DNS settling
      # right after a networking apply.
      - name: Check staging /public/status
        run: |
          ATTEMPTS=6
          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(curl -s -o /tmp/status-response.json -w '%{http_code}' \
              "${{ steps.url.outputs.api_url }}public/status" || true)
            STATUS=${STATUS:-000}
            echo "Attempt $i/$ATTEMPTS: HTTP $STATUS"
            if [ "$STATUS" = "200" ] && jq -e '.serverTime' /tmp/status-response.json > /dev/null 2>&1; then
              echo "Staging is healthy:"
              cat /tmp/status-response.json
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              sleep 10
            fi
          done
          echo "::error::Staging /public/status check failed after $ATTEMPTS attempts (last HTTP $STATUS)"
          cat /tmp/status-response.json || true
          exit 1

  apply-prod:
    name: "Apply (prod)"
    needs: [detect-staging, detect-prod, apply-staging, verify-staging]
    if: >-
      always() &&
      needs.detect-prod.outputs.has_changes == 'true' &&
      needs.detect-prod.result == 'success' &&
      needs.detect-staging.result == 'success' &&
      (needs.apply-staging.result == 'skipped' ||
      (needs.apply-staging.result == 'success' && needs.verify-staging.result == 'success'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/prod
        run: terraform init -input=false

      - name: Download plan from detect job
        uses: actions/download-artifact@v4
        with:
          name: deploy-tfplan-prod
          path: infra/terraform/environments/prod

      - name: Terraform apply
        working-directory: infra/terraform/environments/prod
        run: terraform apply -input=false -no-color tfplan
