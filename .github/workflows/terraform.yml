name: Terraform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/terraform/**"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "eu-north-1"

jobs:
  # --------------- Module: offline terraform test (no AWS credentials) ---------------
  #
  # Every *.tftest.hcl in the module is fully self-contained — it mocks the AWS
  # provider (skip_credentials_validation + override_data on
  # aws_caller_identity/aws_region) — so the whole suite needs no OIDC role and is
  # safe to run on fork PRs.
  #
  # Deliberately not an enumeration of `-filter` flags. That shape looked like an
  # opt-in and behaved like a trapdoor: `terraform test` ignores a `-filter`
  # naming a file that does not exist and still exits 0, so when #507 deleted
  # `retirement.tftest.hcl` the stale filter sat here reporting success, and
  # renaming any remaining file would have silently stopped running it with the
  # check still green. Running everything is self-maintaining, and a future test
  # that does need real credentials will fail loudly here rather than being
  # quietly excluded — which is the signal you want.

  test-module:
    name: "Test (module)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: infra/terraform/modules/greenspace_stack
        run: terraform init -backend=false -input=false

      - name: Terraform test
        working-directory: infra/terraform/modules/greenspace_stack
        run: terraform test -no-color

  # --------------- Pull Request: plan per environment ---------------

  plan-staging:
    name: "Plan (staging)"
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/staging
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra/terraform/environments/staging
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform/environments/staging
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan-output.txt

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: |
            infra/terraform/environments/staging/tfplan
            infra/terraform/environments/staging/plan-output.txt
          retention-days: 7

  plan-prod:
    name: "Plan (prod)"
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/prod
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra/terraform/environments/prod
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform/environments/prod
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan-output.txt

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: |
            infra/terraform/environments/prod/tfplan
            infra/terraform/environments/prod/plan-output.txt
          retention-days: 7

  # --------------- Fork PRs: backend-disabled validate only ---------------

  validate-fork:
    name: "Validate (fork)"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate all environments (backend disabled)
        run: |
          for ENV_DIR in infra/terraform/environments/*; do
            if [ ! -d "$ENV_DIR" ]; then
              continue
            fi
            echo "--- Validating $ENV_DIR ---"
            terraform -chdir="$ENV_DIR" init -backend=false
            terraform -chdir="$ENV_DIR" validate
          done

  # --------------- Deploy pipeline: detect → apply staging → apply prod ---------------

  detect-staging:
    name: "Detect changes (staging)"
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/staging
        run: terraform init -input=false

      - name: Terraform plan (detect changes)
        id: plan
        working-directory: infra/terraform/environments/staging
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform plan failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-tfplan-staging
          path: |
            infra/terraform/environments/staging/tfplan
            infra/terraform/environments/staging/plan-output.txt
          retention-days: 7

  detect-prod:
    name: "Detect changes (prod)"
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/prod
        run: terraform init -input=false

      - name: Terraform plan (detect changes)
        id: plan
        working-directory: infra/terraform/environments/prod
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No changes detected"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "Changes detected"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Terraform plan failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-tfplan-prod
          path: |
            infra/terraform/environments/prod/tfplan
            infra/terraform/environments/prod/plan-output.txt
          retention-days: 7

  apply-staging:
    name: "Apply (staging)"
    needs: detect-staging
    if: needs.detect-staging.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/staging
        run: terraform init -input=false

      - name: Download plan from detect job
        uses: actions/download-artifact@v4
        with:
          name: deploy-tfplan-staging
          path: infra/terraform/environments/staging

      - name: Terraform apply
        working-directory: infra/terraform/environments/staging
        run: terraform apply -input=false -no-color tfplan

  verify-staging:
    name: "Verify (staging)"
    needs: apply-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Function URL
        id: url
        env:
          API_FUNCTION_NAME: ${{ vars.API_FUNCTION_NAME }}
        run: |
          if [ -z "$API_FUNCTION_NAME" ]; then
            echo "::error::API_FUNCTION_NAME variable is not set for the staging environment"
            exit 1
          fi
          URL=$(aws lambda get-function-url-config \
            --function-name "$API_FUNCTION_NAME" \
            --query 'FunctionUrl' --output text)
          if [ -z "$URL" ] || [ "$URL" = "None" ]; then
            echo "::error::Function $API_FUNCTION_NAME has no Function URL configured"
            exit 1
          fi
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"

      # /public/status executes real DB reads, so a 200 here proves the
      # applied stack end to end (Lambda → VPC/networking → RDS), not just
      # that the function is reachable. Retries cover ENI/DNS settling
      # right after a networking apply; failing requests return fast, so
      # the budget is sized for settling time, not request time.
      - name: Check staging /public/status
        env:
          API_URL: ${{ steps.url.outputs.api_url }}
        run: |
          ATTEMPTS=10
          for i in $(seq 1 "$ATTEMPTS"); do
            rm -f /tmp/status-response.json
            STATUS=$(curl -s --max-time 20 -o /tmp/status-response.json -w '%{http_code}' \
              "${API_URL%/}/public/status" || true)
            STATUS=${STATUS:-000}
            echo "Attempt $i/$ATTEMPTS: HTTP $STATUS"
            if [ "$STATUS" = "200" ] && jq -e '.serverTime' /tmp/status-response.json > /dev/null 2>&1; then
              echo "Staging is healthy:"
              cat /tmp/status-response.json
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              sleep 10
            fi
          done
          echo "::error::Staging /public/status check failed after $ATTEMPTS attempts (last HTTP $STATUS)"
          cat /tmp/status-response.json || true
          exit 1

  apply-prod:
    name: "Apply (prod)"
    needs: [detect-staging, detect-prod, apply-staging, verify-staging]
    if: >-
      !cancelled() &&
      needs.detect-prod.outputs.has_changes == 'true' &&
      needs.detect-prod.result == 'success' &&
      needs.detect-staging.result == 'success' &&
      (needs.detect-staging.outputs.has_changes == 'false' ||
      (needs.apply-staging.result == 'success' && needs.verify-staging.result == 'success'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform/environments/prod
        run: terraform init -input=false

      - name: Download plan from detect job
        uses: actions/download-artifact@v4
        with:
          name: deploy-tfplan-prod
          path: infra/terraform/environments/prod

      - name: Terraform apply
        working-directory: infra/terraform/environments/prod
        run: terraform apply -input=false -no-color tfplan
