name: Preview Deploy

# Ephemeral per-PR preview of the web app, following the pattern used by the
# other UN17 repos (un17hub, un17-calendar): an Amplify branch on the *staging*
# app, named after the PR's head branch, built with the same start-job RELEASE
# mechanism deploy-web.yml uses for main.
#
# Isolation: the staging Amplify app pins API_URL to the staging Lambda at the
# app level, so every preview talks to the staging API and staging database
# only. Production runs a separate Amplify app, Lambda, and database — a
# preview has no path to production registration data, and any email it
# triggers goes through the staging API's SES sender to addresses typed into
# the preview, never to resident data (which only exists in production).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/web/**"
      - "packages/shared/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: "eu-north-1"

jobs:
  preview:
    name: Deploy PR preview (staging Amplify)
    # Fork PRs get no OIDC token and no preview; the same-repo check keeps
    # them from failing noisily.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The staging environment's OIDC subject is what the ci-deploy role
    # trusts, and it scopes the environment-level AMPLIFY_APP_ID variable.
    environment: staging
    concurrency:
      # Shared with Preview Teardown so a close event supersedes an in-flight
      # deploy for the same PR.
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Amplify preview branch exists
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if aws amplify get-branch \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name "$BRANCH" > /dev/null 2>&1; then
            echo "Amplify branch $BRANCH already exists"
          else
            aws amplify create-branch \
              --app-id "${{ vars.AMPLIFY_APP_ID }}" \
              --branch-name "$BRANCH" \
              --stage DEVELOPMENT \
              --framework "Next.js - SSR" \
              --no-enable-auto-build \
              --environment-variables NEXT_PUBLIC_ENV=preview \
              --tags purpose=pr-preview,pr="pr-$PR_NUMBER"
            echo "Created Amplify branch $BRANCH"
          fi

      - name: Stop any in-flight preview build
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          JOBS=$(aws amplify list-jobs \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name "$BRANCH" \
            --query "jobSummaries[?status=='PENDING' || status=='PROVISIONING' || status=='RUNNING'].jobId" \
            --output text)
          for JOB in $JOBS; do
            echo "Stopping superseded job $JOB"
            aws amplify stop-job \
              --app-id "${{ vars.AMPLIFY_APP_ID }}" \
              --branch-name "$BRANCH" \
              --job-id "$JOB" || true
          done

      - name: Start Amplify build
        id: start-build
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          JOB=$(aws amplify start-job \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name "$BRANCH" \
            --job-type RELEASE \
            --query 'jobSummary.jobId' --output text)
          echo "job_id=$JOB" >> "$GITHUB_OUTPUT"
          echo "Started Amplify job: $JOB"

      - name: Wait for Amplify build
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          while true; do
            STATUS=$(aws amplify get-job \
              --app-id "${{ vars.AMPLIFY_APP_ID }}" \
              --branch-name "$BRANCH" \
              --job-id "${{ steps.start-build.outputs.job_id }}" \
              --query 'job.summary.status' --output text)
            echo "Build status: $STATUS"
            case "$STATUS" in
              SUCCEED) echo "Build succeeded"; exit 0 ;;
              FAILED|CANCELLING|CANCELLED) echo "::error::Build $STATUS"; exit 1 ;;
              *) sleep 30 ;;
            esac
          done

      - name: Post preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          DEFAULT_DOMAIN=$(aws amplify get-app \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --query 'app.defaultDomain' --output text)
          # Amplify serves a branch at a subdomain with '/' replaced by '-'.
          SUBDOMAIN=$(echo "$BRANCH" | tr -c 'a-zA-Z0-9-\n' '-')
          URL="https://${SUBDOMAIN}.${DEFAULT_DOMAIN}"
          echo "Preview URL: $URL"

          BODY_FILE="$RUNNER_TEMP/preview-comment.md"
          printf '%s\n' \
            "<!-- preview-deploy -->" \
            "### Preview deploy" \
            "" \
            "| | |" \
            "| --- | --- |" \
            "| URL | $URL |" \
            "| Commit | $HEAD_SHA |" \
            "| Backend | staging API + staging database (no production data) |" \
            "" \
            "The preview is torn down when this PR closes." \
            > "$BODY_FILE"

          COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.body | startswith("<!-- preview-deploy -->")) | .id' | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -F body=@"$BODY_FILE" > /dev/null
            echo "Updated existing preview comment $COMMENT_ID"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$BODY_FILE" > /dev/null
            echo "Posted preview comment"
          fi
